name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Core dependencies + dev group only; the gpu extra is never installed in CI.
      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest
